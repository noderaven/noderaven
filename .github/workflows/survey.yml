name: Survey

on:
  schedule:
    - cron: "17 6 * * *"     # every morning
  workflow_dispatch:           # allow manual runs
  push:
    branches:
      - main

jobs:
  survey:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # lets this job push to the output branch
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Draw the sheet, waypoints and legend
        run: node scripts/survey.mjs ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a personal token counts private contributions too.
          SURVEY_TOKEN: ${{ secrets.SURVEY_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
